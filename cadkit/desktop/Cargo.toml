[package]
name = "desk"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.34.1"
pollster = "1.0.1"
serde_json = "1.0.151"
wgpu = "30.0.1"
winit = "0.30.13"
png = "0.17"
wry = "0.57.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Storage_Xps", "Win32_System_Power", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Console"] }
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_System_Performance", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Foundation"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
debug = 1
